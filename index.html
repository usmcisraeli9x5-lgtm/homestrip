<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME STRIP | Creator Platform</title>
    <!-- Paystack SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c0a0f;
            --card-bg: #16121f;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --border: #2a2238;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        
        /* Navigation */
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: var(--text-main); }
        .logo span { color: var(--accent); }
        .badge-18 { background: var(--primary); color: white; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary); }

        .view { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .view.active { display: block; }

        /* Post Layout */
        .post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; padding: 14px; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .creator-info h4 { font-size: 14px; font-weight: 700; }
        .creator-info span { font-size: 12px; color: var(--text-muted); }

        .media-container { position: relative; width: 100%; height: 320px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-container img { width: 100%; height: 100%; object-fit: cover; }
        .media-container.locked img { filter: blur(25px); transform: scale(1.1); }
        
        .paywall-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 15, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
        .price-tag { font-size: 24px; font-weight: 800; color: var(--text-main); }
        .btn-unlock { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; width: 80%; max-width: 250px; }
        
        .post-caption { padding: 14px; font-size: 14px; line-height: 1.4; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }

        /* Age Modal */
        #age-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 15, 0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%; }
        .modal-content h2 { color: var(--primary); margin-bottom: 12px; font-size: 22px; }
        .modal-content p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .btn-agree { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Age Verification -->
    <div id="age-modal">
        <div class="modal-content">
            <h2>18+ Age Verification</h2>
            <p>Welcome to Home Strip. This platform contains adult content intended strictly for adults.</p>
            <button class="btn-agree" onclick="verifyAge()">I am 18 or Older - Enter</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">HOME<span>STRIP</span></div>
        <div class="badge-18">18+ Only</div>
    </header>

    <!-- Views -->
    <div id="feed-view" class="view active">
        <div id="posts-container">
            <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading global feed...</p>
        </div>
    </div>

    <div id="studio-view" class="view">
        <h2 style="margin-bottom: 20px;">Creator Studio</h2>
        <div class="form-group">
            <label>Creator Name</label>
            <input type="text" id="creator-name" class="form-control" placeholder="e.g. Amara Vibe">
        </div>
        <div class="form-group">
            <label>Post Caption</label>
            <textarea id="post-caption-input" class="form-control" rows="3" placeholder="Describe your clip..."></textarea>
        </div>
        <div class="form-group">
            <label>Unlock Price (₦)</label>
            <input type="number" id="post-price" class="form-control" placeholder="2500">
        </div>
        <div class="form-group">
            <label>Media Image URL</label>
            <input type="text" id="post-media" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>
        <button class="btn-primary" onclick="createPost()">Publish Content Live</button>
    </div>

    <div id="settings-view" class="view">
        <h2 style="margin-bottom: 20px;">Platform Configuration</h2>
        <div class="form-group">
            <label>Supabase Publishable Key</label>
            <input type="text" id="supabase-key-input" class="form-control" placeholder="eyJhbGci...">
        </div>
        <div class="form-group">
            <label>Paystack Public Key</label>
            <input type="text" id="paystack-key-input" class="form-control" placeholder="pk_live_...">
        </div>
        <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
    </div>

    <!-- Nav Bar -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('feed')">
            <span>🔥</span> Feed
        </button>
        <button class="nav-item" onclick="switchTab('studio')">
            <span>🎥</span> Studio
        </button>
        <button class="nav-item" onclick="switchTab('settings')">
            <span>⚙️</span> Settings
        </button>
    </nav>

    <script>
        const SUPABASE_URL = "https://vypsemwlbomslczvnxix.supabase.co";
        let supabaseClient = null;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            const key = localStorage.getItem('supabase_pub_key');
            if (key) {
                supabaseClient = supabase.createClient(SUPABASE_URL, key);
            }
            return supabaseClient;
        }

        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(tab + '-view').classList.add('active');
            event.currentTarget.classList.add('active');
            if(tab === 'feed') renderFeed();
        }

        function verifyAge() {
            document.getElementById('age-modal').style.display = 'none';
        }

        function saveSettings() {
            const sbKey = document.getElementById('supabase-key-input').value;
            const psKey = document.getElementById('paystack-key-input').value;
            
            if(sbKey) localStorage.setItem('supabase_pub_key', sbKey);
            if(psKey) localStorage.setItem('paystack_pub_key', psKey);
            
            supabaseClient = null;
            alert('Settings saved successfully!');
            renderFeed();
        }

        async function renderFeed() {
            const container = document.getElementById('posts-container');
            const client = getSupabase();

            if (!client) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; background: var(--card-bg); border-radius: 12px;">
                        <h3>Backend Connection Needed</h3>
                        <p style="color:var(--text-muted); font-size:13px; margin: 10px 0;">Go to Settings and paste your Supabase Publishable Key to load global posts.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">Fetching global posts...</p>`;

            const { data: posts, error } = await client.from('posts').select('*').order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color:red; text-align:center;">Error loading posts: ${error.message}</p>`;
                return;
            }

            if (!posts || posts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 40px;">No posts published yet. Go to Studio to publish the first post!</p>`;
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const initial = post.name ? post.name.charAt(0).toUpperCase() : 'C';
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="avatar">${initial}</div>
                        <div class="creator-info">
                            <h4>${post.name}</h4>
                            <span>${post.handle}</span>
                        </div>
                    </div>
                    <div class="media-container ${post.unlocked ? '' : 'locked'}">
                        <img src="${post.media}" alt="Post Media">
                        ${!post.unlocked ? `
                            <div class="paywall-overlay">
                                <div class="price-tag">₦${Number(post.price).toLocaleString()}</div>
                                <button class="btn-unlock" onclick="payWithPaystack(${post.price})">Unlock Exclusive Content</button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="post-caption">${post.caption}</div>
                `;
                container.appendChild(card);
            });
        }

        async function createPost() {
            const client = getSupabase();
            if (!client) {
                alert('Please configure your Supabase Publishable Key in Settings first!');
                switchTab('settings');
                return;
            }

            const name = document.getElementById('creator-name').value || "Creator";
            const caption = document.getElementById('post-caption-input').value;
            const price = document.getElementById('post-price').value || 1000;
            const media = document.getElementById('post-media').value || "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600";

            if(!caption) {
                alert('Please enter a caption');
                return;
            }

            const newPost = {
                name: name,
                handle: "@" + name.toLowerCase().replace(/\s+/g, ''),
                caption: caption,
                price: Number(price),
                media: media,
                unlocked: false
            };

            const { error } = await client.from('posts').insert([newPost]);

            if (error) {
                alert('Publishing failed: ' + error.message);
            } else {
                alert('Published live globally!');
                document.getElementById('creator-name').value = '';
                document.getElementById('post-caption-input').value = '';
                document.getElementById('post-price').value = '';
                document.getElementById('post-media').value = '';
                switchTab('feed');
            }
        }

        function payWithPaystack(price) {
            const pubKey = localStorage.getItem('paystack_pub_key') || 'pk_live_e28e80eb3c55079272d529568d6';
            
            let handler = PaystackPop.setup({
                key: pubKey,
                email: 'supporter@homestrip.ng',
                amount: price * 100,
                currency: 'NGN',
                callback: function(response){
                    alert('Payment successful! Reference: ' + response.reference);
                },
                onClose: function(){
                    alert('Transaction canceled.');
                }
            });
            handler.openIframe();
        }

        // Initialize on load
        if(localStorage.getItem('supabase_pub_key')) {
            document.getElementById('supabase-key-input').value = localStorage.getItem('supabase_pub_key');
        }
        if(localStorage.getItem('paystack_pub_key')) {
            document.getElementById('paystack-key-input').value = localStorage.getItem('paystack_pub_key');
        }
        renderFeed();
    </script>
</body>
</html>
