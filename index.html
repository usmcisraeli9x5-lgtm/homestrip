<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME STRIP | Creator Platform</title>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0c0a0f;
            --card-bg: #16121f;
            --primary: #ff0055;
            --accent: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --border: #2a2238;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: var(--text-main); }
        .logo span { color: var(--accent); }
        .badge-18 { background: var(--primary); color: white; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary); }

        .view { display: none; padding: 20px; max-width: 600px; margin: 0 auto; }
        .view.active { display: block; }

        .post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; padding: 14px; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .creator-info h4 { font-size: 14px; font-weight: 700; }
        .creator-info span { font-size: 12px; color: var(--text-muted); }

        .media-container { position: relative; width: 100%; height: 320px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .media-container.locked img, .media-container.locked video { filter: blur(25px); transform: scale(1.1); pointer-events: none; }
        
        .paywall-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 15, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
        .price-tag { font-size: 24px; font-weight: 800; color: var(--text-main); }
        .btn-unlock { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; width: 80%; max-width: 250px; }
        
        .post-caption { padding: 14px; font-size: 14px; line-height: 1.4; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-secondary { width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn-accent { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--primary); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        .profile-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal-body { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HOME<span>STRIP</span></div>
        <div class="badge-18">18+ Only</div>
    </header>

    <div id="feed-view" class="view active">
        <div id="posts-container">
            <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading global feed...</p>
        </div>
    </div>

    <div id="studio-view" class="view">
        <div id="auth-section">
            <h2 style="margin-bottom: 20px;">Creator Access</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" class="form-control" placeholder="creator@homestrip.ng">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="loginCreator()">Log In</button>
            <button class="btn-secondary" onclick="signUpCreator()">Sign Up as Creator</button>
        </div>

        <div id="studio-post-section" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2>Creator Studio</h2>
                <button class="btn-secondary" style="width:auto; padding:6px 12px;" onclick="logoutCreator()">Log Out</button>
            </div>

            <!-- Creator Bank Details -->
            <div style="background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
                <h3 style="font-size: 15px; margin-bottom: 12px; color: var(--accent);">Bank Payout Settings</h3>
                <div class="form-group">
                    <label>Bank Name</label>
                    <input type="text" id="bank-name" class="form-control" placeholder="e.g. GTBank, Kuda, Zenith">
                </div>
                <div class="form-group">
                    <label>Account Number</label>
                    <input type="number" id="account-number" class="form-control" placeholder="0123456789">
                </div>
                <button class="btn-secondary" onclick="saveBankDetails()">Save Payout Info</button>
            </div>

            <h3 style="font-size: 15px; margin-bottom: 12px;">Publish New Media</h3>
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" id="creator-name" class="form-control" placeholder="e.g. Amara Vibe">
            </div>
            <div class="form-group">
                <label>Post Caption</label>
                <textarea id="post-caption-input" class="form-control" rows="3" placeholder="Describe your clip..."></textarea>
            </div>
            <div class="form-group">
                <label>Unlock Price (₦)</label>
                <input type="number" id="post-price" class="form-control" placeholder="2500">
            </div>
            <div class="form-group">
                <label>Media URL (Image or MP4 Video)</label>
                <input type="text" id="post-media" class="form-control" placeholder="https://... image or .mp4 video link">
            </div>
            <button class="btn-primary" onclick="createPost()">Publish Content Live</button>
        </div>
    </div>

    <div id="profile-view" class="view">
        <div id="profile-header-container"></div>
        <h3>Published Content</h3>
        <div id="profile-posts-container" style="margin-top: 15px;"></div>
    </div>

    <div id="settings-view" class="view">
        <h2 style="margin-bottom: 20px;">Platform Configuration</h2>
        <div class="form-group">
            <label>Supabase Publishable Key</label>
            <input type="text" id="supabase-key-input" class="form-control" placeholder="sb_publishable_...">
        </div>
        <div class="form-group">
            <label>Paystack Public Key</label>
            <input type="text" id="paystack-key-input" class="form-control" placeholder="pk_live_...">
        </div>
        <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
    </div>

    <!-- Tip Modal -->
    <div id="tip-modal" class="modal-overlay">
        <div class="modal-body">
            <h3 style="margin-bottom: 10px; color: var(--accent);">Send Creator Tip 💸</h3>
            <div class="form-group">
                <label>Tip Amount (₦)</label>
                <input type="number" id="tip-amount" class="form-control" value="2000">
            </div>
            <div class="form-group">
                <label>Optional Note</label>
                <input type="text" id="tip-note" class="form-control" placeholder="Love your work!">
            </div>
            <button class="btn-primary" onclick="processTip()">Send Tip Now</button>
            <button class="btn-secondary" onclick="closeModal('tip-modal')">Cancel</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('feed')">
            <span>🔥</span> Feed
        </button>
        <button class="nav-item" onclick="switchTab('studio')">
            <span>🎥</span> Studio
        </button>
        <button class="nav-item" onclick="switchTab('settings')">
            <span>⚙️</span> Settings
        </button>
    </nav>

    <script>
        const SUPABASE_URL = "https://vypsemwlbomslczvnxix.supabase.co";
        let supabaseClient = null;
        let activeCreatorForTip = null;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            const key = localStorage.getItem('supabase_pub_key');
            if (key) {
                supabaseClient = supabase.createClient(SUPABASE_URL, key);
            }
            return supabaseClient;
        }

        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(tab + '-view').classList.add('active');
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
            
            if(tab === 'feed') renderFeed();
            if(tab === 'studio') checkAuthStatus();
        }

        function saveSettings() {
            const sbKey = document.getElementById('supabase-key-input').value;
            const psKey = document.getElementById('paystack-key-input').value;
            
            if(sbKey) localStorage.setItem('supabase_pub_key', sbKey);
            if(psKey) localStorage.setItem('paystack_pub_key', psKey);
            
            supabaseClient = null;
            alert('Settings saved successfully!');
            renderFeed();
        }

        async function signUpCreator() {
            const client = getSupabase();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return alert('Enter email and password');

            const { data, error } = await client.auth.signUp({ email, password });
            if(error) alert(error.message);
            else {
                alert('Account created! Logging you in...');
                checkAuthStatus();
            }
        }

        async function loginCreator() {
            const client = getSupabase();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if(!email || !password) return alert('Enter email and password');

            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if(error) alert(error.message);
            else checkAuthStatus();
        }

        async function logoutCreator() {
            const client = getSupabase();
            await client.auth.signOut();
            checkAuthStatus();
        }

        async function checkAuthStatus() {
            const client = getSupabase();
            if(!client) return;

            const { data: { session } } = await client.auth.getSession();
            if(session) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('studio-post-section').style.display = 'block';
                
                // Fetch creator saved bank info
                const { data: profile } = await client.from('profiles').select('*').eq('id', session.user.id).single();
                if(profile && profile.bio) {
                    const bankParts = profile.bio.split('|');
                    if(bankParts.length === 2) {
                        document.getElementById('bank-name').value = bankParts[0];
                        document.getElementById('account-number').value = bankParts[1];
                    }
                }
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('studio-post-section').style.display = 'none';
            }
        }

        async function saveBankDetails() {
            const client = getSupabase();
            const { data: { session } } = await client.auth.getSession();
            if(!session) return alert('Please log in first.');

            const bank = document.getElementById('bank-name').value;
            const account = document.getElementById('account-number').value;

            if(!bank || !account) return alert('Enter both bank name and account number.');

            const { error } = await client.from('profiles').upsert({
                id: session.user.id,
                bio: `${bank}|${account}`,
                updated_at: new Date()
            });

            if(error) alert('Error saving bank details: ' + error.message);
            else alert('Bank payout settings saved successfully!');
        }

        function isVideoUrl(url) {
            return url.match(/\.(mp4|webm|ogg|mov)($|\?)/i) || url.includes('video');
        }

        function renderMediaHTML(url, unlocked) {
            if (isVideoUrl(url)) {
                return `
                    <video src="${url}" ${unlocked ? 'controls' : ''} loop playsinline muted autoplay></video>
                `;
            } else {
                return `<img src="${url}" alt="Post Media">`;
            }
        }

        async function renderFeed() {
            const container = document.getElementById('posts-container');
            const client = getSupabase();

            if (!client) {
                container.innerHTML = `<p style="text-align:center; padding:20px;">Configure key in Settings tab.</p>`;
                return;
            }

            const { data: posts, error } = await client.from('posts').select('*').order('id', { ascending: false });
            if (error || !posts) {
                container.innerHTML = `<p style="text-align:center; padding:20px;">No posts available.</p>`;
                return;
            }

            container.innerHTML = '';
            posts.forEach(post => {
                const initial = post.name ? post.name.charAt(0).toUpperCase() : 'C';
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header" style="cursor:pointer;" onclick="openProfile('${post.name}', '${post.handle}')">
                        <div class="avatar">${initial}</div>
                        <div class="creator-info">
                            <h4>${post.name}</h4>
                            <span>${post.handle}</span>
                        </div>
                    </div>
                    <div class="media-container ${post.unlocked ? '' : 'locked'}">
                        ${renderMediaHTML(post.media, post.unlocked)}
                        ${!post.unlocked ? `
                            <div class="paywall-overlay">
                                <div class="price-tag">₦${Number(post.price).toLocaleString()}</div>
                                <button class="btn-unlock" onclick="payWithPaystack(${post.price})">Unlock Exclusive Content</button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="post-caption">${post.caption}</div>
                `;
                container.appendChild(card);
            });
        }

        async function openProfile(name, handle) {
            switchTab('profile');
            activeCreatorForTip = name;
            const client = getSupabase();
            const initial = name.charAt(0).toUpperCase();

            document.getElementById('profile-header-container').innerHTML = `
                <div class="profile-card">
                    <div class="profile-avatar">${initial}</div>
                    <h2>${name}</h2>
                    <p style="color:var(--text-muted); font-size:14px;">${handle}</p>
                    <p style="font-size:13px; color:var(--text-muted); margin-top:8px;">Verified Creator on Home Strip.</p>
                    <div class="profile-actions">
                        <button class="btn-accent" onclick="openModal('tip-modal')">Send Tip 💸</button>
                    </div>
                </div>
            `;

            const { data: posts } = await client.from('posts').select('*').eq('name', name).order('id', { ascending: false });
            const container = document.getElementById('profile-posts-container');
            container.innerHTML = '';

            if(!posts || posts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted);">No posts from this creator yet.</p>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="media-container ${post.unlocked ? '' : 'locked'}">
                        ${renderMediaHTML(post.media, post.unlocked)}
                        ${!post.unlocked ? `<div class="paywall-overlay"><div class="price-tag">₦${Number(post.price).toLocaleString()}</div><button class="btn-unlock" onclick="payWithPaystack(${post.price})">Unlock</button></div>` : ''}
                    </div>
                    <div class="post-caption">${post.caption}</div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function processTip() {
            const amount = document.getElementById('tip-amount').value || 1000;
            closeModal('tip-modal');
            payWithPaystack(amount, `Tip for ${activeCreatorForTip}`);
        }

        async function createPost() {
            const client = getSupabase();
            const { data: { session } } = await client.auth.getSession();

            const name = document.getElementById('creator-name').value || "Creator";
            const caption = document.getElementById('post-caption-input').value;
            const price = document.getElementById('post-price').value || 1000;
            const media = document.getElementById('post-media').value || "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600";

            if(!caption) return alert('Enter a caption');

            const newPost = {
                user_id: session ? session.user.id : null,
                name: name,
                handle: "@" + name.toLowerCase().replace(/\s+/g, ''),
                caption: caption,
                price: Number(price),
                media: media,
                unlocked: false
            };

            const { error } = await client.from('posts').insert([newPost]);

            if (error) alert('Publishing failed: ' + error.message);
            else {
                alert('Published live!');
                document.getElementById('post-caption-input').value = '';
                switchTab('feed');
            }
        }

        function payWithPaystack(price, customNote) {
            const pubKey = localStorage.getItem('paystack_pub_key') || 'pk_live_e28e80eb3c55079272d529568d6';
            let handler = PaystackPop.setup({
                key: pubKey,
                email: 'supporter@homestrip.ng',
                amount: price * 100,
                currency: 'NGN',
                callback: function(response){ alert((customNote || 'Payment') + ' successful! Ref: ' + response.reference); },
                onClose: function(){ alert('Canceled.'); }
            });
            handler.openIframe();
        }

        if(localStorage.getItem('supabase_pub_key')) document.getElementById('supabase-key-input').value = localStorage.getItem('supabase_pub_key');
        if(localStorage.getItem('paystack_pub_key')) document.getElementById('paystack-key-input').value = localStorage.getItem('paystack_pub_key');
        renderFeed();
    </script>
</body>
</html>
